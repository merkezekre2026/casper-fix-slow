name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $results | Format-Table -AutoSize RuleName, ScriptName, Line, Message
          if ($results) { exit 1 }

  dry-run:
    name: Dry run (Windows PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Önizleme modunda tüm adımlar
        shell: powershell
        run: |
          .\scripts\CasperFix.ps1 -All -DryRun -Unattended
          $errors = Select-String -Path .\logs\*.log -Pattern '\[ERROR\]'
          if ($errors) { $errors; exit 1 }
          if (Test-Path .\backups) { Write-Error 'DryRun yedek klasörü oluşturmamalı'; exit 1 }
      - name: Sistem raporu
        shell: powershell
        run: |
          .\scripts\diagnostics\SystemReport.ps1 -OutFile "$env:RUNNER_TEMP\rapor.txt"
          if (-not (Test-Path "$env:RUNNER_TEMP\rapor.txt")) { exit 1 }
